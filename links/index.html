    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />

    <script type="module" crossorigin src="/assets/links-DaSTMX3u.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="stylesheet" crossorigin href="/assets/links-DLb4975b.css">
  </head>
  <body>
    <main class="stage">
      <article class="pass" aria-labelledby="name">
        <h1 class="name" id="name"><span class="name__first">Ikki</span> <span class="name__last">Shoka</span></h1>

        <div class="edge">
          <p class="edge__ja" lang="ja">生賀 一輝</p>
          <p class="edge__city">Tokyo, Japan</p>
        </div>

        <figure class="portrait">
          <img src="/assets/portrait-photo-20261101.jpg" width="1024" height="1024" alt="Ikki Shoka, dressed in white, leaning on folded arms against a pale blue background" fetchpriority="high" decoding="async" />
        </figure>

        <nav class="keys" aria-label="Social">
          <a class="key" href="https://line.me/ti/p/fcYeCTGAGG" rel="noopener noreferrer">
            <svg class="icon key__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4C7.3 4 3.5 7 3.5 10.8c0 3.3 2.9 6.1 6.9 6.7l-.4 2.7 3.6-2.6c4.1-.4 6.9-3.3 6.9-6.8C20.5 7 16.7 4 12 4Z" /></svg>
            <svg class="icon key__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M9 7h8v8" /></svg>
            <span class="key__label">LINE</span>
            <span class="key__hint" lang="ja">友だち追加</span>
          </a>
          <a class="key" href="https://www.instagram.com/ichigo_abc/" rel="noopener noreferrer">
            <svg class="icon key__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="5" /><circle cx="12" cy="12" r="4" /><circle class="fill" cx="17.2" cy="6.8" r="1.1" /></svg>
            <svg class="icon key__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M9 7h8v8" /></svg>
            <span class="key__label">Instagram</span>
            <span class="key__hint">@ichigo_abc</span>
          </a>
        </nav>

        <a class="folio" href="/">
          <span class="folio__label">Portfolio</span>
          <span class="folio__hint">skikkh.github.io</span>
          <svg class="icon folio__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h15M13 6l6 6-6 6" /></svg>
        </a>

        <div class="foot">
          <button class="qr-open" id="qr-open" type="button" aria-haspopup="dialog" aria-controls="qr-dialog" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2.5v2.5H14zM20 14v6h-6" /></svg>
            QR code
          </button>
          <a class="paypay" href="https://qr.paypay.ne.jp/p2p01_ameYb3lC2TFDA0eh" rel="noopener noreferrer">
            PayPay
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M9 7h8v8" /></svg>
          </a>
        </div>
      </article>
    </main>

    <dialog class="qr" id="qr-dialog" aria-labelledby="qr-title" aria-describedby="qr-note">
      <h2 class="qr__title" id="qr-title">Scan to open this page</h2>
      <p class="qr__note" id="qr-note" lang="ja">スマートフォンのカメラで読み取ると、このページが開きます。</p>
      <div class="qr__code">
        <img src="/assets/contact-qr.svg" width="240" height="240" alt="QR code for https://skikkh.github.io/links/" decoding="async" />
      </div>
      <p class="qr__url" id="qr-url">https://skikkh.github.io/links/</p>
      <form class="qr__actions" method="dialog">
        <button class="btn btn--ink" id="qr-copy" type="button">Copy link</button>
        <button class="btn" type="submit">Close</button>
      </form>
      <p class="qr__status" id="qr-status" role="status" aria-live="polite"></p>
    </dialog>
  </body>
</html>
