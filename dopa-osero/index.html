<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
/* Layout: one arcade-cabinet column (logo bar, HUD, status, board, tension gauge, buttons); ray canvas behind, particle canvas + cut-ins in front */
:root{
  color-scheme:dark;
  --bg:#0b0320;
  --panel:rgba(24,8,56,.84);
  --panel-solid:#170838;
  --ink:#fff4fc;
  --ink-dim:#c4b3e8;
  --ink-dark:#1a0633;
  --paper:#ffffff;
  --pink:#ff2bd6;
  --cyan:#1ff2ff;
  --gold:#ffd21f;
  --red:#ff2f4f;
  --violet:#8b5cff;
  --mint:#7dffb0;
  --line:rgba(255,255,255,.14);
  --red-soft:#ff8296;
  --felt:#16a052;
  --felt-deep:#0a6b33;
  --felt-line:#032b13;
  --disc-b:#0d0d0d;
  --disc-w:#f2f2f2;
  --hl-you:var(--gold);
  --hl-cpu:var(--red);
  --you-c:var(--disc-b);
  --cpu-c:var(--disc-w);
  --hint-bg:rgba(0,0,0,.6);
  --hint-fg:var(--paper);
  --rainbow:linear-gradient(90deg,#ff2bd6,#ffd21f,#7dffb0,#1ff2ff,#8b5cff,#ff2bd6);
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --flip:440ms;
  --bw:min(100%,600px,max(300px,calc(100vh - 330px)));
}
[data-fx="lite"]{--flip:300ms}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:14px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:47;pointer-events:none;display:block}

#stage{position:relative;z-index:1;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:filter 1s}
body.lost #stage{filter:grayscale(.75) brightness(.75)}

/* top bar */
.topbar{width:var(--bw);display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;line-height:1;white-space:nowrap}
.logo b{font-weight:400;background:var(--rainbow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rbshift 3s linear infinite}
.tbtns{display:flex;gap:6px}
.tbtn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--cyan)}
.tbtn:focus-visible,.btn:focus-visible,.go:focus-visible,.x:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{width:var(--bw);display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.pcard{--c:var(--hl-you);position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:10px;padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:box-shadow .3s,transform .3s,border-color .3s;min-width:0}
.pcard.cpu{--c:var(--hl-cpu);grid-template-columns:1fr auto;text-align:right}
.pcard .chip{grid-row:1 / span 2;width:clamp(26px,7vw,36px);aspect-ratio:1;border-radius:50%}
.pcard.cpu .chip{grid-column:2}
.pcard .who{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .num{font-family:var(--f-display);font-size:clamp(28px,8vw,44px);line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.pcard.cpu .who,.pcard.cpu .num{grid-column:1}
.pcard.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px var(--c);transform:translateY(-2px);animation:act 1.4s ease-in-out infinite}
@keyframes act{50%{box-shadow:0 0 0 1px var(--c),0 0 40px var(--c)}}
.num.bump{animation:bump .28s cubic-bezier(.2,2,.4,1)}
@keyframes bump{0%{transform:scale(1.5);color:var(--gold)}100%{transform:none}}
.vs{display:grid;justify-items:center;align-content:center;gap:5px;min-width:64px}
.vs b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1;background:linear-gradient(180deg,#fff,var(--gold) 60%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5a1800)}
.lvb{font-family:var(--f-display);font-size:12px;line-height:1;padding:4px 9px;border-radius:999px;color:var(--ink-dark);background:var(--ink-dim);white-space:nowrap}
.lvb.lv1{background:var(--mint)}.lvb.lv2{background:var(--cyan)}.lvb.lv3{background:var(--gold)}.lvb.lv4{background:var(--red);color:var(--paper)}
.lvb.lv5{background:var(--rainbow);background-size:200% 100%;animation:rbshift 2s linear infinite}
.mc{font-size:11px;color:var(--ink-dim);white-space:nowrap;font-variant-numeric:tabular-nums}

/* status + speech */
.statusrow{width:var(--bw);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.status{margin:0;font-family:var(--f-display);font-size:15px;line-height:1.2;white-space:nowrap}
.status.you{color:var(--hl-you);text-shadow:0 0 12px var(--hl-you)}
.status.think{color:var(--red-soft)}
.status.think::after{content:"";display:inline-block;width:1.4em;text-align:left;animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.status.demo{color:var(--gold);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.bubble{position:relative;margin:0;background:var(--paper);color:var(--ink-dark);font-weight:800;font-size:13px;line-height:1.3;padding:6px 12px;border-radius:14px;opacity:0;transform:scale(.6) translateY(4px);transform-origin:90% 0;transition:opacity .18s,transform .25s cubic-bezier(.2,1.8,.4,1);min-width:0;max-width:62%;text-align:center}
.bubble::before{content:"";position:absolute;top:-7px;right:24px;border:7px solid transparent;border-top:0;border-bottom-color:var(--paper)}
.bubble.show{opacity:1;transform:none}

/* advantage meter */
.meter{width:var(--bw);display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.meter .ml{font-family:var(--f-display);font-size:11px;color:var(--ink-dim);letter-spacing:.1em}
.meter .bar{position:relative;height:18px;border-radius:999px;background:var(--cpu-c);overflow:hidden;box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,210,31,.45)}
.meter .fill{position:absolute;inset:0 auto 0 0;width:50%;background:var(--you-c);transition:width .7s cubic-bezier(.3,1.5,.5,1);box-shadow:3px 0 0 var(--gold),6px 0 14px var(--gold)}
.meter .mtxt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:11px;color:var(--gold);letter-spacing:.06em;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 0 #000;white-space:nowrap}

/* board */
.board-wrap{width:var(--bw);display:grid;grid-template-columns:16px minmax(0,1fr);grid-template-rows:16px auto;gap:3px}
.cols{grid-column:2;display:grid;grid-template-columns:repeat(8,1fr);padding-inline:9px;font-family:var(--f-display);font-size:11px;color:var(--ink-dim);text-align:center;line-height:16px}
.rows{grid-row:2;display:grid;grid-template-rows:repeat(8,1fr);padding-block:9px;font-family:var(--f-display);font-size:11px;color:var(--ink-dim);align-items:center;text-align:center}
.frame{grid-column:2;grid-row:2;padding:7px;border-radius:20px;background:conic-gradient(from var(--ang),var(--pink),var(--gold),var(--cyan),var(--violet),var(--pink));animation:spin 5s linear infinite;box-shadow:0 0 36px rgba(255,43,214,.35),0 0 80px rgba(31,242,255,.18)}
.fever .frame{animation-duration:1.1s;box-shadow:0 0 50px rgba(255,210,31,.6),0 0 110px rgba(255,43,214,.45)}
[data-fx="lite"] .frame{animation:none}
@keyframes spin{to{--ang:360deg}}
.frame.punch{animation:spin 5s linear infinite,punch .32s cubic-bezier(.2,2,.4,1)}
@keyframes punch{0%{transform:scale(1.035)}100%{transform:none}}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;padding:2px;aspect-ratio:1;border-radius:13px;background:var(--felt-line);box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--felt-line);transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.dot.a{left:calc((100% - 18px) / 4 + 5px);top:calc((100% - 18px) / 4 + 5px)}
.dot.b{left:calc((100% - 18px) * .75 + 13px);top:calc((100% - 18px) / 4 + 5px)}
.dot.c{left:calc((100% - 18px) / 4 + 5px);top:calc((100% - 18px) * .75 + 13px)}
.dot.d{left:calc((100% - 18px) * .75 + 13px);top:calc((100% - 18px) * .75 + 13px)}
.cell{position:relative;display:block;width:100%;height:100%;min-width:0;appearance:none;-webkit-appearance:none;border:0;margin:0;padding:0;background:radial-gradient(circle at 50% 30%,var(--felt),var(--felt-deep) 88%);border-radius:3px;cursor:default;outline:none}
.cell.rip{animation:rip .42s cubic-bezier(.3,1.6,.5,1) var(--d,0ms) both}
@keyframes rip{0%{transform:none}35%{transform:translateY(calc(var(--ra,6px) * -1)) scale(1.05)}100%{transform:none}}
.cell:nth-child(1){border-top-left-radius:11px}.cell:nth-child(8){border-top-right-radius:11px}.cell:nth-child(57){border-bottom-left-radius:11px}.cell:nth-child(64){border-bottom-right-radius:11px}
.cell.legal{cursor:pointer}
.cell:focus-visible{box-shadow:inset 0 0 0 3px var(--gold);z-index:4}
.lift{position:absolute;inset:8%;perspective:420px;z-index:2}
.disc{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--flip) cubic-bezier(.45,-.35,.35,1.45)}
.disc[data-c="e"]{opacity:0}
.disc.instant{transition:none}
.face{position:absolute;inset:0;border-radius:50%;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.fw{transform:rotateY(180deg)}
.fb{background:radial-gradient(circle at 34% 28%,#9a9a9a 0 3%,#3c3c3c 10%,#161616 36%,#050505 76%,#000 100%);box-shadow:0 3px 6px rgba(0,0,0,.55),0 0 0 1.5px rgba(255,255,255,.22),inset 0 2px 2px rgba(255,255,255,.3),inset 0 -3px 6px rgba(255,255,255,.06)}
.fw{background:radial-gradient(circle at 34% 28%,#fff 0 12%,#f1f1f1 36%,#d4d4d4 76%,#b4b4b4 100%);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 2px 2px #fff,inset 0 -3px 6px rgba(0,0,0,.18)}
.lift::before{content:"";position:absolute;inset:-24%;border-radius:50%;background:radial-gradient(circle,rgba(255,244,180,.95),rgba(255,210,31,.55) 40%,transparent 70%);opacity:0;pointer-events:none}
.lift.drop{animation:drop .5s cubic-bezier(.2,1.5,.4,1)}
.lift.drop::before{animation:glow .6s ease-out}
.lift.pop{animation:pop var(--flip) ease-out}
.lift.pop::before{animation:glow var(--flip) ease-out}
.lift.pop2{animation:pop2 calc(var(--flip) + 280ms) cubic-bezier(.3,1.3,.5,1)}
.lift.pop2::before{animation:glow calc(var(--flip) + 280ms) ease-out}
@keyframes drop{0%{transform:translateY(-60%) scale(2.6);opacity:0}55%{transform:scale(.84);opacity:1}100%{transform:none}}
@keyframes pop{0%{transform:none}45%{transform:scale(1.35)}100%{transform:none}}
@keyframes pop2{0%{transform:none}40%{transform:translateY(-30%) scale(1.8)}100%{transform:none}}
@keyframes glow{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.cell.wf .lift{animation:wf .38s ease-in-out infinite alternate}
.cell.wf .lift::before{opacity:.6}
@keyframes wf{to{transform:translateY(-7%) scale(1.08)}}
.hint{position:absolute;inset:33%;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(9px,2.3vw,14px);line-height:1;color:var(--hint-fg);background:var(--hint-bg);box-shadow:0 0 0 2px var(--gold),0 0 14px var(--gold);opacity:0;transform:scale(.2);transition:opacity .2s,transform .2s,inset .15s,font-size .15s;pointer-events:none;z-index:3}
.cell.legal .hint{opacity:.92;transform:none;animation:hp 1.1s ease-in-out infinite}
.cell.legal .hint[data-t="2"]{background:var(--gold);color:var(--ink-dark);box-shadow:0 0 0 2px var(--paper),0 0 18px var(--gold)}
.cell.legal .hint[data-t="3"]{color:var(--ink-dark);box-shadow:0 0 0 2px var(--paper),0 0 22px var(--pink);background:var(--rainbow);background-size:200% 100%;animation:hp 1.1s ease-in-out infinite,rbshift 1.2s linear infinite}
.fever .cell.legal .hint{color:var(--ink-dark);background:var(--rainbow);background-size:200% 100%;animation:hp .7s ease-in-out infinite,rbshift .8s linear infinite}
.cell.legal:hover .hint,.cell.legal:focus-visible .hint{inset:12%;opacity:.62;font-size:clamp(13px,3.6vw,22px)}
[data-fx="lite"] .cell.legal .hint{animation:none}
@keyframes hp{50%{transform:scale(1.18)}}
.cell.last::after{content:"";position:absolute;inset:40%;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red),0 0 0 2px rgba(0,0,0,.35);z-index:3;pointer-events:none}
.cell.best .hint{background:var(--gold);box-shadow:0 0 24px var(--gold)}
.cell.best::before{content:"ココ!";position:absolute;left:50%;bottom:86%;transform:translateX(-50%);font-family:var(--f-display);font-size:clamp(10px,2.6vw,14px);line-height:1;color:var(--ink-dark);background:var(--gold);padding:4px 7px;border-radius:7px;white-space:nowrap;z-index:6;pointer-events:none;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translate(-50%,-5px)}}
.cell.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* tension gauge */
.gauge{width:var(--bw);display:grid;gap:4px}
.glbl{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-display);font-size:12px;letter-spacing:.06em}
.glbl #gVal{color:var(--ink-dim);font-variant-numeric:tabular-nums}
.track{position:relative;height:14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(11,3,32,.7) calc(10% - 2px) 10%)}
.gfill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));box-shadow:0 0 16px var(--pink);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.fever .gfill{background:var(--rainbow);background-size:200% 100%;animation:rbshift .7s linear infinite}
.fever .glbl #gName{background:var(--rainbow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rbshift .7s linear infinite}

/* controls */
.controls{width:var(--bw);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 6px;font-family:var(--f-display);font-size:14px;letter-spacing:.04em;cursor:pointer;color:var(--ink-dark);background:linear-gradient(180deg,#fff,var(--cyan));box-shadow:0 4px 0 #0a6f8f,0 0 14px rgba(31,242,255,.35);transition:transform .08s,box-shadow .08s,filter .2s;white-space:nowrap}
.btn.alt{background:linear-gradient(180deg,#fff,var(--pink));box-shadow:0 4px 0 #8a0068,0 0 14px rgba(255,43,214,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a6f8f}
.btn.alt:active{box-shadow:0 1px 0 #8a0068}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}

/* floating text */
.ft,.fc{position:fixed;z-index:48;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--f-display);white-space:nowrap;color:var(--paper)}
.ft{font-size:clamp(20px,5vw,34px);text-shadow:0 0 12px var(--hl-you),0 3px 0 rgba(0,0,0,.55);animation:ftup 1.1s cubic-bezier(.2,.9,.3,1) forwards}
.ft.small{font-size:clamp(14px,3.6vw,20px)}
.ft.gold{color:var(--gold);text-shadow:0 0 14px var(--gold),0 3px 0 #5a2a00}
.ft.cpu{text-shadow:0 0 12px var(--hl-cpu),0 3px 0 rgba(0,0,0,.55)}
@keyframes ftup{0%{transform:translate(-50%,-20%) scale(.3);opacity:0}18%{transform:translate(-50%,-60%) scale(1.25);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.fc{font-size:clamp(22px,6vw,40px);text-shadow:0 0 14px var(--hl-you),0 3px 0 rgba(0,0,0,.6)}
.fc.bump{animation:fcb .18s ease-out}
.fc.hot{color:var(--gold);text-shadow:0 0 18px var(--gold),0 3px 0 #5a2a00}
.fc.rb{background:var(--rainbow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(255,210,31,.7));animation:rbshift 1s linear infinite}
.fc.rb.bump{animation:fcb .18s ease-out,rbshift 1s linear infinite}
.fc.gone{animation:ftup .75s ease-out forwards}
@keyframes fcb{0%{transform:translate(-50%,-50%) scale(1.7)}100%{transform:translate(-50%,-50%) scale(1)}}

/* flash, speed lines, cut-ins */
#flash{position:fixed;inset:0;z-index:43;pointer-events:none;opacity:0;background:var(--paper)}
#flash.run{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:var(--fa,.5)}100%{opacity:0}}
#lines{position:fixed;inset:-25%;z-index:44;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0deg 2.4deg,rgba(255,255,255,.5) 2.8deg 3.2deg,rgba(255,255,255,0) 3.6deg 7deg);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 20%,#000 60%);mask:radial-gradient(circle at 50% 50%,transparent 20%,#000 60%)}
#lines.on{animation:lines 1s ease-out}
@keyframes lines{0%{opacity:0;transform:scale(1.3)}12%{opacity:1}100%{opacity:0;transform:scale(1) rotate(5deg)}}
#cutin{position:fixed;inset:0;z-index:45;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.ci{--b1:#ff2f4f;--b2:#b00020;--b3:var(--gold);position:relative;width:100%;display:grid;justify-items:center;padding-block:clamp(10px,2.6vh,24px);transform:rotate(-4deg)}
.ci .band{position:absolute;inset:0 -10%;background:repeating-linear-gradient(-45deg,var(--b1) 0 22px,var(--b2) 22px 44px);background-size:62px 62px;box-shadow:0 0 0 4px var(--b3),0 0 60px var(--b3);animation:bandin .22s ease-out,slide .5s linear infinite}
@keyframes bandin{from{transform:scaleY(0)}}
@keyframes slide{to{background-position:62px 0}}

#leds{position:fixed;inset:0;z-index:2;pointer-events:none;--la:var(--gold);--lb:var(--pink);--ls:1.6s}

#leds .t,#leds .b{left:0;right:0;height:10px;background:radial-gradient(circle at 8px 5px,var(--la) 0 2.6px,transparent 3.4px) 0 0/16px 10px repeat-x,radial-gradient(circle at 8px 5px,var(--lb) 0 2.6px,transparent 3.4px) 8px 0/16px 10px repeat-x;animation:ledx var(--ls) linear infinite}
#leds .l,#leds .r{top:0;bottom:0;width:10px;background:radial-gradient(circle at 5px 8px,var(--la) 0 2.6px,transparent 3.4px) 0 0/10px 16px repeat-y,radial-gradient(circle at 5px 8px,var(--lb) 0 2.6px,transparent 3.4px) 0 8px/10px 16px repeat-y;animation:ledy var(--ls) linear infinite}
#leds .t{top:0}#leds .b{bottom:0;animation-direction:reverse}#leds .l{left:0;animation-direction:reverse}#leds .r{right:0}
@keyframes ledx{to{background-position:16px 0,24px 0}}
@keyframes ledy{to{background-position:0 16px,0 24px}}

/* score, beat glow, board shine, warp ring, hanko seals, camera zoom */
.score{display:flex;align-items:baseline;gap:6px;min-width:0;font-family:var(--f-display);white-space:nowrap}

.rank.r4{background:#e8f8ff;color:var(--ink-dark)}.rank.r5{background:var(--cyan);color:var(--ink-dark)}.rank.r6{background:var(--violet)}
.rank.r7{background:var(--red)}.rank.r8{background:var(--rainbow);background-size:200% 100%;color:var(--ink-dark);animation:rbshift 1s linear infinite}

/* slot, chance cells, CRITICAL slash, rank-up toast */
#slot{position:absolute;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%);pointer-events:none}
#slot .sl{--sl:var(--cyan);display:grid;gap:7px;justify-items:center;padding:10px 12px 12px;border-radius:18px;background:linear-gradient(180deg,#2a0b5e,#12042e);border:3px solid var(--sl);box-shadow:0 0 0 3px #000,0 0 34px var(--sl),0 20px 50px rgba(0,0,0,.7)}

@keyframes slin{from{transform:scale(.3);opacity:0}}
#slot .sl-top{font-family:var(--f-display);font-size:12px;letter-spacing:.24em;color:var(--gold)}

#slot .reel{position:relative;width:clamp(54px,12vw,72px);height:clamp(54px,12vw,72px);overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#cfcfd6,#fff 30%,#fff 70%,#cfcfd6);box-shadow:inset 0 0 0 2px #000,inset 0 9px 10px rgba(0,0,0,.35),inset 0 -9px 10px rgba(0,0,0,.35)}

#slot .sym{height:var(--ch,60px);display:grid;place-items:center;font-family:var(--f-display);font-size:calc(var(--ch,60px) * .62);line-height:1}
#slot .s0{color:var(--red);text-shadow:0 2px 0 #600}

#slot .s2{color:#c27a00;text-shadow:0 2px 0 #5a2a00}
#slot .s3{color:#ff9500;text-shadow:0 2px 0 #6a3000}
#slot .s4{color:#0a78b8;text-shadow:0 2px 0 #032a45}
#slot .s5{color:#d4009e;text-shadow:0 2px 0 #4b003c}
#slot .sl-msg{min-height:1.15em;font-family:var(--f-display);font-size:16px;line-height:1.15;color:var(--paper);white-space:nowrap}
#slot[data-c="blue"] .sl{--sl:#3b82ff}#slot[data-c="green"] .sl{--sl:#3dff7a}#slot[data-c="red"] .sl{--sl:var(--red)}
#slot[data-c="rainbow"] .sl{--sl:var(--paper);animation:hue .6s linear infinite}

#slot.hit .sl{--sl:var(--gold);animation:slreach .12s ease-in-out infinite alternate,hue .5s linear infinite}

.cell.lucky{animation:lucky .9s linear infinite}
@keyframes lucky{0%,100%{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 18px var(--gold)}33%{box-shadow:inset 0 0 0 3px var(--pink),inset 0 0 18px var(--pink)}66%{box-shadow:inset 0 0 0 3px var(--cyan),inset 0 0 18px var(--cyan)}}
.cell.lucky::after{content:"×5";position:absolute;top:4%;right:7%;font-family:var(--f-display);font-size:clamp(9px,2vw,13px);line-height:1;color:var(--gold);text-shadow:0 0 3px #000,0 0 8px var(--gold);z-index:4;pointer-events:none}
.ft.crit{font-size:clamp(22px,6vw,40px);color:var(--paper);text-shadow:0 0 12px var(--red),0 0 30px var(--red),0 3px 0 #000}
.slash{position:fixed;width:150vmax;height:10px;margin:-5px 0 0 -75vmax;z-index:46;pointer-events:none;background:linear-gradient(90deg,transparent,#fff 20%,#fff 80%,transparent);box-shadow:0 0 24px #fff,0 0 50px var(--red);transform:rotate(var(--a)) scaleX(0);animation:slash .55s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes slash{0%{transform:rotate(var(--a)) scaleX(0);opacity:1}30%{transform:rotate(var(--a)) scaleX(1);opacity:1}100%{transform:rotate(var(--a)) scaleX(1) scaleY(.15);opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:49;pointer-events:none;transform:translate(-50%,-160%);opacity:0;font-family:var(--f-display);font-size:clamp(18px,5vw,28px);line-height:1;padding:9px 18px;border-radius:999px;color:var(--ink-dark);background:var(--rainbow);background-size:200% 100%;box-shadow:0 0 0 3px var(--paper),0 0 40px var(--gold);white-space:nowrap}

/* danmaku, disco floor, board stunts, PREMIUM blackout, RUSH */
.dm{position:fixed;left:100%;z-index:47;pointer-events:none;white-space:nowrap;font-family:var(--f-display);font-size:clamp(16px,3.4vw,28px);line-height:1;text-shadow:0 0 2px #000,0 0 2px #000,0 2px 0 #000;opacity:.92;animation:dm var(--dur,4s) linear forwards}

/* Dela Gothic One は「ﾟ」「∀」が豆腐なので、その文字だけ端末の標準ゴシックで描く */

@keyframes dm{to{transform:translateX(calc(-100vw - 100%))}}
.cell.disco{animation:disco .45s ease-out}
@keyframes disco{0%{box-shadow:inset 0 0 0 100px var(--dc)}100%{box-shadow:inset 0 0 0 100px transparent}}
.board-wrap.spin{animation:bspin 1s cubic-bezier(.5,0,.3,1)}
@keyframes bspin{50%{transform:rotate(180deg) scale(.82)}100%{transform:rotate(360deg)}}
.board-wrap.flipx{animation:bflip .85s cubic-bezier(.5,0,.3,1)}

#freeze{position:fixed;inset:0;z-index:50;pointer-events:none;background:#000;opacity:0;display:grid;place-items:center}

.rush .frame{animation-duration:.6s;box-shadow:0 0 60px var(--gold),0 0 130px var(--red)}

.share{display:block;text-align:center;text-decoration:none;padding:12px;border-radius:12px;background:#000;color:var(--paper);font-family:var(--f-display);font-size:15px;letter-spacing:.04em;box-shadow:0 0 0 2px var(--paper),0 0 18px rgba(255,255,255,.25)}

.score b{font-weight:400;font-size:20px;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,var(--gold) 60%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,210,31,.5))}
.score.up b{filter:drop-shadow(0 0 12px rgba(255,210,31,1))}
.ft.pts{font-size:clamp(12px,2.8vw,17px);color:var(--gold);text-shadow:0 0 8px var(--gold),0 2px 0 #000;animation-duration:.9s}
.frame{position:relative;isolation:isolate}
.frame::before{content:"";position:absolute;inset:-12px;border-radius:30px;z-index:-1;background:conic-gradient(var(--pink),var(--gold),var(--cyan),var(--violet),var(--pink));filter:blur(22px);opacity:calc(.2 + var(--beat,0) * .8);pointer-events:none;will-change:opacity}
.shine{position:absolute;inset:0;border-radius:13px;overflow:hidden;pointer-events:none;z-index:5}

.shine.run i{animation:shine .9s ease-out}
@keyframes shine{0%{transform:translateX(0) skewX(-20deg);opacity:1}100%{transform:translateX(480%) skewX(-20deg);opacity:1}}
.warp{position:fixed;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;border-radius:50%;pointer-events:none;z-index:41;-webkit-backdrop-filter:blur(2px) saturate(2.6) brightness(1.6);backdrop-filter:blur(2px) saturate(2.6) brightness(1.6);-webkit-mask:radial-gradient(circle closest-side,transparent 86%,#000 92%,#000 95%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 86%,#000 92%,#000 95%,transparent 100%);transform:scale(.02);animation:warp .75s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes warp{70%{opacity:1}to{transform:scale(1);opacity:0}}
.hanko{position:fixed;z-index:48;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);box-sizing:border-box;border-radius:50%;border:calc(var(--s) * .08) solid var(--red);color:var(--red);background:rgba(255,248,240,.93);display:grid;place-items:center;font-family:var(--f-display);font-size:calc(var(--s) * .58);line-height:1;box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 30px rgba(255,47,79,.7);pointer-events:none;opacity:0;animation:hanko 1.2s cubic-bezier(.2,1.6,.4,1) forwards}
.hanko.gold{border-color:var(--gold);color:#b36b00;box-shadow:0 0 0 3px var(--paper),0 0 40px var(--gold)}

.hanko.cpu{background:#1a0008;color:var(--red);border-color:var(--red)}
@keyframes hanko{0%{transform:rotate(var(--r)) scale(3.2);opacity:0}14%{transform:rotate(var(--r)) scale(.9);opacity:1}24%{transform:rotate(var(--r)) scale(1.05)}78%{opacity:1;transform:rotate(var(--r)) scale(1)}100%{transform:rotate(var(--r)) scale(1.1);opacity:0}}
.board-wrap.zoom{animation:zoom .65s cubic-bezier(.2,1.3,.4,1)}
@keyframes zoom{0%{transform:none}22%{transform:scale(1.16)}100%{transform:none}}
.rpts{margin:-4px 0 0;display:flex;justify-content:center;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--f-display)}
.rpts span{font-size:12px;letter-spacing:.14em;color:var(--ink-dim)}

<script>
(() => {
'use strict';

/*ENGINE-START*/
function ENGINE(){
  const DR=[-1,-1,-1,0,0,1,1,1],DC=[-1,0,1,-1,1,-1,0,1];
  const RAYS=[],NB=[];
  for(let s=0;s<64;s++){
    const r=s>>3,c=s&7,L=[],N=[];
    for(let d=0;d<8;d++){
      const ray=[];let rr=r+DR[d],cc=c+DC[d];
      if(rr>=0&&rr<8&&cc>=0&&cc<8)N.push(rr*8+cc);
      while(rr>=0&&rr<8&&cc>=0&&cc<8){ray.push(rr*8+cc);rr+=DR[d];cc+=DC[d];}
      if(ray.length>=2)L.push(ray);
    }
    RAYS.push(L);NB.push(N);
  }
  const W=[
    100,-25,10, 5, 5,10,-25,100,
    -25,-45,-2,-2,-2,-2,-45,-25,
     10, -2, 3, 1, 1, 3, -2, 10,
      5, -2, 1, 0, 0, 1, -2,  5,
      5, -2, 1, 0, 0, 1, -2,  5,
     10, -2, 3, 1, 1, 3, -2, 10,
    -25,-45,-2,-2,-2,-2,-45,-25,
    100,-25,10, 5, 5,10,-25,100];
  const ADJ=[[0,1,8,9],[7,6,15,14],[56,57,48,49],[63,62,55,54]];
  const ORDER=[];for(let s=0;s<64;s++)ORDER.push(s);ORDER.sort((a,b)=>W[b]-W[a]);
  const WIN=1e6;

  function canPlay(b,s,me){
    const L=RAYS[s],op=-me;
    for(let i=0;i<L.length;i++){
      const ray=L[i];
      if(b[ray[0]]!==op)continue;
      for(let k=1;k<ray.length;k++){const v=b[ray[k]];if(v===op)continue;if(v===me)return true;break;}
    }
    return false;
  }
  function legal(b,me){const o=[];for(let s=0;s<64;s++)if(b[s]===0&&canPlay(b,s,me))o.push(s);return o;}
  function countMoves(b,me){let n=0;for(let s=0;s<64;s++)if(b[s]===0&&canPlay(b,s,me))n++;return n;}
  function flipsOf(b,s,me){
    const o=[];if(b[s]!==0)return o;
    const L=RAYS[s],op=-me;
    for(let i=0;i<L.length;i++){
      const ray=L[i];let k=0;
      while(k<ray.length&&b[ray[k]]===op)k++;
      if(k>0&&k<ray.length&&b[ray[k]]===me)for(let j=0;j<k;j++)o.push(ray[j]);
    }
    return o;
  }
  const STK=new Int8Array(4096);let sp=0;
  function make(b,s,me){
    const L=RAYS[s],op=-me;let n=0;
    for(let i=0;i<L.length;i++){
      const ray=L[i];let k=0;
      while(k<ray.length&&b[ray[k]]===op)k++;
      if(k>0&&k<ray.length&&b[ray[k]]===me){for(let j=0;j<k;j++){b[ray[j]]=me;STK[sp++]=ray[j];}n+=k;}
    }
    b[s]=me;return n;
  }
  function unmake(b,s,me,n){b[s]=0;for(let i=0;i<n;i++)b[STK[--sp]]=-me;}

  function finalScore(b,me){let d=0,e=0;for(let s=0;s<64;s++){const v=b[s];if(v===me)d++;else if(v)d--;else e++;}if(d>0)d+=e;else if(d<0)d-=e;return d;}
  function evaluate(b,me){
    let pos=0,disc=0,emp=0,fr=0;
    for(let s=0;s<64;s++){
      const v=b[s];
      if(v===0){emp++;continue;}
      const sg=v===me?1:-1;
      pos+=sg*W[s];disc+=sg;
      const nb=NB[s];
      for(let k=0;k<nb.length;k++){if(b[nb[k]]===0){fr+=sg;break;}}
    }
    for(let i=0;i<4;i++){
      const a=ADJ[i];
      if(b[a[0]]!==0){for(let k=1;k<4;k++){const v=b[a[k]];if(v===me)pos-=W[a[k]];else if(v===-me)pos+=W[a[k]];}}
    }
    const m1=countMoves(b,me),m2=countMoves(b,-me);
    if(m1+m2===0){const f=finalScore(b,me);return f>0?WIN+f:f<0?-WIN+f:0;}
    let sc=pos+90*(m1-m2)/(m1+m2+2)-6*fr;
    if(emp<20)sc+=disc*(20-emp)*.6;
    return sc;
  }

  let deadline=Infinity,nodes=0;const TO={timeout:true};
  const MB=[],KB=[];for(let i=0;i<80;i++){MB.push(new Int8Array(40));KB.push(new Int32Array(40));}
  function gen(b,me,buf){let n=0;for(let i=0;i<64;i++){const s=ORDER[i];if(b[s]===0&&canPlay(b,s,me))buf[n++]=s;}return n;}
  function tick(){if((++nodes&2047)===0&&Date.now()>deadline)throw TO;}

  function nega(b,me,d,al,be,ply,passed){
    tick();
    if(d<=0)return evaluate(b,me);
    const buf=MB[ply],n=gen(b,me,buf);
    if(n===0){
      if(passed){const f=finalScore(b,me);return f>0?WIN+f:f<0?-WIN+f:0;}
      return -nega(b,-me,d-1,-be,-al,ply+1,true);
    }
    let best=-Infinity;
    for(let i=0;i<n;i++){
      const s=buf[i],f=make(b,s,me);
      const v=-nega(b,-me,d-1,-be,-al,ply+1,false);
      unmake(b,s,me,f);
      if(v>best){best=v;if(v>al){al=v;if(al>=be)break;}}
    }
    return best;
  }
  function solve(b,me,al,be,ply,passed,emp){
    tick();
    const buf=MB[ply],n=gen(b,me,buf);
    if(n===0){
      if(passed||emp===0)return finalScore(b,me);
      return -solve(b,-me,-be,-al,ply+1,true,emp);
    }
    if(emp>5&&n>1){
      const kb=KB[ply];
      for(let i=0;i<n;i++){const s=buf[i],f=make(b,s,me);kb[i]=countMoves(b,-me)*128-W[s];unmake(b,s,me,f);}
      for(let i=1;i<n;i++){const ks=kb[i],ss=buf[i];let j=i-1;while(j>=0&&kb[j]>ks){kb[j+1]=kb[j];buf[j+1]=buf[j];j--;}kb[j+1]=ks;buf[j+1]=ss;}
    }
    let best=-99;
    for(let i=0;i<n;i++){
      const s=buf[i],f=make(b,s,me);
      const v=-solve(b,-me,-be,-al,ply+1,false,emp-1);
      unmake(b,s,me,f);
      if(v>best){best=v;if(v>al){al=v;if(al>=be)break;}}
    }
    return best;
  }
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function quick(b0,me){
    deadline=Date.now()+250;nodes=0;
    try{const b=Int8Array.from(b0);sp=0;return nega(b,me,3,-Infinity,Infinity,0,false);}catch(e){if(e!==TO)throw e;return 0;}
  }
  // level → search budget. 99 = hint for the player
  const CFG={3:{depth:3,time:900,exact:8},4:{depth:6,time:1400,exact:11},5:{depth:40,time:2200,exact:14},99:{depth:6,time:900,exact:11}};
  function search(board,me,level){
    const b0=Int8Array.from(board);
    const moves=shuffle(legal(b0,me));
    if(!moves.length)return{move:-1,score:0};
    let emp=0;for(let s=0;s<64;s++)if(b0[s]===0)emp++;
    if(level===1)return{move:moves[0],score:quick(b0,me)};
    if(level===2){
      let bm=moves[0],bv=-Infinity;
      if(Math.random()>.2){
        for(const s of moves){const v=flipsOf(b0,s,me).length*2+W[s]*.15+Math.random()*6;if(v>bv){bv=v;bm=s;}}
      }
      return{move:bm,score:quick(b0,me)};
    }
    const cfg=CFG[level]||CFG[4];
    nodes=0;
    if(emp<=cfg.exact){
      deadline=Date.now()+cfg.time*1.5;
      try{
        const b=Int8Array.from(b0);sp=0;
        const keyed=moves.map(s=>{const f=make(b,s,me);const k=countMoves(b,-me);unmake(b,s,me,f);return[k,s];}).sort((x,y)=>x[0]-y[0]);
        let al=-65,bs=-99,bm=keyed[0][1];
        for(const [,s] of keyed){
          const f=make(b,s,me);
          const v=-solve(b,-me,-65,-al,1,false,emp-1);
          unmake(b,s,me,f);
          if(v>bs){bs=v;bm=s;if(v>al)al=v;}
        }
        return{move:bm,score:bs,exact:true,nodes};
      }catch(e){if(e!==TO)throw e;}
    }
    deadline=Date.now()+cfg.time;
    let best=moves[0],bestScore=0,done=0;const order=moves.slice();
    for(let d=1;d<=cfg.depth;d++){
      try{
        const b=Int8Array.from(b0);sp=0;
        let al=-Infinity,bs=-Infinity,bm=order[0];const sc=new Map();
        for(const s of order){
          const f=make(b,s,me);
          const v=-nega(b,-me,d-1,-Infinity,-al,1,false);
          unmake(b,s,me,f);
          sc.set(s,v);
          if(v>bs){bs=v;bm=s;}
          if(v>al)al=v;
        }
        best=bm;bestScore=bs;done=d;
        order.sort((x,y)=>sc.get(y)-sc.get(x));
        if(Math.abs(bs)>=WIN||d>=emp)break;
      }catch(e){if(e!==TO)throw e;break;}
    }
    return{move:best,score:bestScore,depth:done,nodes};
  }
  return{legal,flipsOf,countMoves,search,WIN};
}

/* ---------- AI runs in a worker so effects never stutter ---------- */
const AI=(()=>{
  let w=null,seq=0;const pend=new Map();
  const SRC='const E=('+ENGINE.toString()+')();onmessage=function(e){var d=e.data,r;try{r=E.search(d.board,d.me,d.level)}catch(err){r={move:-1}}postMessage({id:d.id,r:r})};';
  function runLocal(p){setTimeout(()=>{let r;try{r=E.search(p.board,p.me,p.level);}catch(e){r={move:-1};}p.res(r);},20);}
  function spawn(){
    try{
      const url=URL.createObjectURL(new Blob([SRC],{type:'text/javascript'}));
      w=new Worker(url);
      w.onmessage=e=>{const p=pend.get(e.data.id);if(p){pend.delete(e.data.id);p.res(e.data.r);}};
      w.onerror=ev=>{if(ev&&ev.preventDefault)ev.preventDefault();w=null;for(const [id,p] of pend){pend.delete(id);runLocal(p);}};
    }catch(e){w=null;}
  }
  function ask(board,me,level){
    return new Promise(res=>{
      const p={res,board:Array.from(board),me,level};
      if(!w){runLocal(p);return;}
      const id=++seq;pend.set(id,p);
      try{w.postMessage({id,board:p.board,me,level});}catch(e){pend.delete(id);runLocal(p);}
    });
  }
  function reset(){
    if(w&&pend.size){w.terminate();w=null;for(const [,p] of pend)p.res({move:-1,stale:true});pend.clear();spawn();}
  }
  spawn();
  return{ask,reset};
})();

// Irodori-TTS clips shipped in voice.js (window.DOPA_VOICE: id -> base64 MP3).
// Two channels: the announcer cuts itself off; a CPU line waits until the announcer has finished.
const VOICE=(()=>{
  // 声は 女の子(voice-girl.js) / 男(voice-male.js) / なし を切り替え。選んだ方だけ読み込む
  const FILE={girl:'voice-girl.js',male:'voice-male.js'},VAR={girl:'DOPA_VOICE_GIRL',male:'DOPA_VOICE_MALE'};
  const bufs=new Map(),pending={};let annSrc=null,cpuSrc=null,annEnd=0;
  const kind=()=>STORE.voice==='male'||STORE.voice==='off'?STORE.voice:'girl';
  function load(k=kind(),cb){
    if(k==='off')return;
    if(window[VAR[k]]){if(cb)cb();return;}
    if(pending[k]){if(cb)pending[k].push(cb);return;}
    pending[k]=cb?[cb]:[];
    const sc=document.createElement('script');sc.src=FILE[k];sc.async=true;
    sc.onload=()=>{const l=pending[k]||[];pending[k]=null;l.forEach(f=>f());};
    sc.onerror=()=>{pending[k]=null;};
    document.head.append(sc);
  }
  const raw=id=>{const k=kind();if(k==='off')return null;const d=window[VAR[k]];return d&&d[id];};
  function decode(id){
    const key=kind()+':'+id;
    if(bufs.has(key))return bufs.get(key);
    const b64=raw(id),ctx=SND.ctx;
    if(!b64||!ctx)return Promise.resolve(null);
    const p=new Promise(res=>{
      try{const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);ctx.decodeAudioData(u8.buffer,res,()=>res(null));}
      catch(e){res(null);}
    });
    bufs.set(key,p);return p;
  }
  function play(id,chan){
    if(SND.mode===0||!raw(id))return;
    SND.init();const ctx=SND.ctx;if(!ctx)return;
    decode(id).then(buf=>{
      if(!buf||SND.mode===0||!SND.voiceBus)return;
      const now=ctx.currentTime;let at=now;
      if(chan==='ann'){if(annSrc){try{annSrc.stop();}catch(e){}}}
      else{if(cpuSrc){try{cpuSrc.stop();}catch(e){}}at=Math.max(now,annEnd+.05);}
      const src=ctx.createBufferSource();src.buffer=buf;src.connect(SND.voiceBus);src.start(at);
      if(chan==='ann'){annSrc=src;annEnd=at+buf.duration;}else cpuSrc=src;
      SND.duckFor(at,buf.duration);
    });
  }
  return{load,say(key){play('ann_'+key,'ann');},cpu(level,key,i){play(`lv${level}_${key}_${i}`,'cpu');}};
})();

  function resize(){
    w=cv.width=Math.max(1,Math.round(innerWidth/2));h=cv.height=Math.max(1,Math.round(innerHeight/2));

      cx.fillStyle=`hsla(${hue},100%,${fever?60:55}%,${al})`;
      cx.beginPath();cx.moveTo(ox,oy);cx.arc(ox,oy,R,a0,a1);cx.closePath();cx.fill();

// the whole board bounces outward from the placed disc
function ripple(sq,amp){

/* ---------- ドパスロット: spins while the CPU thinks ---------- */
const SYMS=['7','神','角','★','ド','パ'];
const PAY=[77777,333333,50000,30000,10000,10000];
const SLOT=(()=>{
  const el=$('#slot'),box=el.querySelector('.sl'),msg=$('#slMsg'),N=SYMS.length;
  const reels=[...el.querySelectorAll('.reel')].map(r=>{
    const strip=document.createElement('div');strip.className='strip';
    for(let k=0;k<N*3;k++){const d=document.createElement('div');d.className='sym s'+(k%N);d.textContent=SYMS[k%N];strip.append(d);}
    r.append(strip);return{r,strip,pos:(Math.random()*N)|0,spd:0,stop:null,lastI:0};
  });
  let CH=60,raf=0,last=0,tickT=0;
  const easeBack=k=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
  const easeCubic=k=>1-Math.pow(1-k,3);
  function render(){for(const rl of reels){const p=((rl.pos%N)+N)%N;rl.strip.style.transform=`translateY(${(-(p+N)*CH).toFixed(1)}px)`;}}
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;let active=false;
    for(const rl of reels){
      if(rl.stop){
        const st=rl.stop,k=Math.min(1,(now-st.t0)/st.d);rl.pos=st.from+(st.to-st.from)*st.ease(k);active=true;
        if(k>=1){rl.pos=st.to;rl.stop=null;rl.spd=0;SND.reelStop();st.done();}
      }else if(rl.spd){rl.pos-=rl.spd*dt;active=true;}
      const i=Math.floor(rl.pos);if(i!==rl.lastI){rl.lastI=i;if(now-tickT>45){tickT=now;SND.reelTick();}}
    }
    render();raf=active?requestAnimationFrame(loop):0;
  }
  function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}}
  // reels scroll downward; land on `sym` after `cycles` extra turns
  function stopAt(rl,sym,d,cycles=1,ease=easeBack){
    return new Promise(res=>{
      const from=rl.pos;let to=Math.floor(from)-N*cycles;const cur=((to%N)+N)%N;to-=((cur-sym)+N)%N;
      if(to>=from)to-=N;
      rl.stop={from,to,t0:performance.now(),d,ease,done:res};kick();
    });
  }
  function hide(){
    el.hidden=true;el.className='';el.dataset.c='';msg.textContent='';
    for(const rl of reels){rl.spd=0;if(rl.stop){const d=rl.stop.done;rl.stop=null;d();}}
    return 0;
  }
  function pickSym(q){
    const w=[3,(q.n>=7||S.fever>0)?2:.6,q.corner?4:1.5,3,4,4];let r=Math.random()*w.reduce((a,b)=>a+b,0);
    for(let i=0;i<N;i++){r-=w[i];if(r<0)return i;}return N-1;
  }
  // reach colour hints the odds; rainbow only ever appears on a hit
  function reachColor(hit){const r=Math.random();return hit?(r<.3?'rainbow':r<.85?'red':'green'):(r<.5?'blue':r<.88?'green':'red');}
  function jackpot(a,pay,prem){
    el.classList.remove('reach');el.classList.add('hit');
    msg.textContent=`${prem?'PREMIUM':'大当たり!!'} +${pay.toLocaleString('en-US')}`;
    const r=box.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
    cutin(prem?'PREMIUM 神神神!!':`${SYMS[a]}${SYMS[a]}${SYMS[a]} 大当たり!!`,'rainbow',`+${pay.toLocaleString('en-US')}`,prem?2000:1500);
    VOICE.say(prem?'premium':a===1?'kamikourin':'ooatari');
    danmaku('huge',prem?30:18);SND.airhorn();FX.kanji(x,y,30);FX.glitch(12);if(prem)boardSpin('spin');
    SND.jackpot();flash('#ffffff',.45);invert();FX.shake(22);BG.bump(1.5);LED.set('rainbow',2500);speedLines();
    FX.coins(x,y,90,1.4);FX.confetti(160);FX.storm(3);FX.ring(x,y,10,Math.max(innerWidth,innerHeight)*.7,50,14,36);
    for(let k=0;k<4;k++)later(150+k*250,()=>{FX.firework(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.4),Math.random()*360);SND.firework();});
    S.st.slots=(S.st.slots||0)+1;
    if(a===1&&S.fever===0){S.fever=3;S.tension=100;BG.setFever(true);SND.setFever(true);LED.base();gauge();}
    if(a===0||prem)later(1300,startRush);
  }
  // PREMIUM: the screen goes black and silent, then a million points
  async function premium(g){
    el.hidden=false;el.className='';el.dataset.c='';msg.textContent='';
    CH=reels[0].r.clientHeight||60;for(const rl of reels){rl.strip.style.setProperty('--ch',CH+'px');rl.spd=0;rl.stop=null;rl.pos=1;}render();
    SND.duck(true);freeze(true);
    await wait(1400);if(g!==GEN){freeze(false);SND.duck(false);return hide();}
    freeze(true,true);SND.premium();VOICE.say('premium_w');
    await wait(1500);freeze(false);SND.duck(false);if(g!==GEN)return hide();
    const pay=1000000*(S.rush>0?2:1);S.score+=pay;jackpot(1,pay,true);
    await wait(1900);if(g!==GEN)return hide();
    hide();return pay;
  }
  async function run(q){
    if(S.fx!=='max')return 0;
    const g=GEN;
    const wt=CI_UNTIL-performance.now()-300;if(wt>0)await wait(wt);
    if(g!==GEN)return 0;
    if(Math.random()<(S.rush>0?1/15:1/40))return premium(g);
    const pHit=Math.min(.55,.1+q.n*.025+(q.lucky?.25:0)+(q.corner?.1:0))+(S.fever>0?.25:0)+(S.rush>0?.4:0);
    const hit=Math.random()<pHit,other=a=>(a+1+((Math.random()*(N-1))|0))%N;
    let a,b,c;
    if(hit){a=b=c=pickSym(q);}
    else{a=(Math.random()*N)|0;c=Math.random()<.3?a:other(a);b=other(a);}
    const reach=a===c,color=reach?reachColor(hit):'';
    el.hidden=false;el.className='';el.dataset.c='';msg.textContent='';restart(box,'in');
    CH=reels[0].r.clientHeight||60;for(const rl of reels)rl.strip.style.setProperty('--ch',CH+'px');
    for(const rl of reels)rl.spd=24+Math.random()*4;
    kick();
    await wait(320);if(g!==GEN)return hide();
    await stopAt(reels[0],a,300);if(g!==GEN)return hide();
    await wait(70);
    await stopAt(reels[2],c,300);if(g!==GEN)return hide();
    if(reach){
      el.classList.add('reach');el.dataset.c=color;
      msg.textContent=color==='rainbow'?'虹リーチ!! 確定!!':'リーチ!!';
      VOICE.say(color==='rainbow'?'kakutei':'reach');
      SND.riser();SND.heart();FX.shake(6);BG.bump(.6);LED.set(color==='rainbow'?'rainbow':'hot',2400);danmaku('slot',color==='rainbow'?14:6);
      reels[1].spd=7;
      await wait(color==='rainbow'?500:1000);if(g!==GEN)return hide();
      await stopAt(reels[1],b,1300,0,easeCubic);if(g!==GEN)return hide();
    }else{
      await stopAt(reels[1],b,300);if(g!==GEN)return hide();
    }
    let pay=0;
    if(hit){pay=PAY[a]*(S.fever>0?2:1)*(S.rush>0?2:1);S.score+=pay;jackpot(a,pay);await wait(1500);}
    else if(reach){msg.textContent='ハズレ…';SND.miss();await wait(650);}
    else await wait(180);
    if(g!==GEN)return hide();
    hide();return pay;
  }
  return{run,hide};
})();

async function playMove(sq,me,fl,actor){
  const g=GEN,demo=actor==='demo',max=S.fx==='max'&&!demo;
  const before=counts(),n=fl.length,hue=actor==='cpu'?350:45;
  // score multiplier: the streak so far, ×3 during FEVER, ×5 on a chance cell, ×2 on a CRITICAL
  const lucky=actor==='human'&&sq===S.lucky,crit=actor==='human'&&max&&Math.random()<.12;
  const mult=actor==='human'?(1+.5*Math.min(S.combo,6))*(S.fever>0?3:1)*(lucky?5:1)*(crit?2:1):0;
  if(actor==='human')S.lucky=-1;
  let c=cellCenter(sq);
  if(max){FX.meteor(c.x,c.y,hue);SND.meteor();await wait(170);if(g!==GEN)return;}
  S.board[sq]=me;for(const f of fl)S.board[f]=me;

  for(let i=0;i<64;i++)cells[i].el.classList.toggle('last',i===sq);
  setDisc(sq,me,'drop');

  const huge=actor==='human'&&n>=7;
  if(!demo){
    SND.place();warp(c.x,c.y);

  ord.forEach((f,i)=>later(hs+i*step,()=>{
    const dr=Math.sign((f>>3)-r0),dc=Math.sign((f&7)-c0);

      if(max)FX.shake(3+i*.7);
    }
    if(counter)counter.set(i+1);
    updateCounts();
  }));
  await wait(hs+ord.length*step+(!max?220:320+spins*220));
  if(g!==GEN)return;
  updateCounts();
  if(counter)counter.done(n);
  if(!demo)celebrate(sq,me,n,actor,before,mult,lucky,crit);
}

/* ---------- turn flow ---------- */
function stableSnap(){
  S.stable={board:Array.from(S.board),turn:S.turn,human:S.human,level:S.level,moveNo:S.moveNo,last:S.last,
    tension:S.tension,fever:S.fever,combo:S.combo,undos:S.undos,score:S.score,rush:S.rush,history:S.history.slice(),st:{...S.st}};
}
function nextTurn(){
  if(S.phase==='over')return;
  hud();gauge();
  const me=S.turn,moves=E.legal(S.board,me);
  if(!moves.length){
    if(!E.legal(S.board,-me).length){endGame();return;}
    S.busy=true;controls();clearHints();
    if(S.phase==='play'){
      status('pass');
      if(me===S.human){cutin('パス…','pass','置けるマスがない');SND.pass();say('youPass');}
      else{cutin('CPUパス!!','gold','もう一回あなたの番');SND.coin();say('cpuPass');FX.coins(innerWidth/2,innerHeight/2,24);}
    }
    later(S.phase==='play'?1300:500,()=>{S.turn=-me;nextTurn();});
    return;
  }
  if(S.phase==='demo'){S.busy=true;later(650,()=>demoMove(moves));return;}
  stableSnap();
  if(me===S.human){S.busy=false;S.slotQ=null;showHints(moves);pickLucky(moves);status('you');controls();shine();}
  else cpuTurn();
}
function demoMove(moves){
  let bm=moves[0],bv=-1e9;
  for(const m of moves){const v=E.flipsOf(S.board,m,S.turn).length+(CORNERS.includes(m)?8:0)+Math.random()*5;if(v>bv){bv=v;bm=m;}}
  const g=GEN;
  playMove(bm,S.turn,E.flipsOf(S.board,bm,S.turn),'demo').then(()=>{if(g!==GEN)return;S.turn=-S.turn;nextTurn();});
}
async function cpuTurn(){
  const g=GEN;
  S.busy=true;clearHints();status('think');controls();
  if(Math.random()<.35)say('think');
  const q=S.slotQ;S.slotQ=null;
  const slotP=q?SLOT.run(q):null;
  const t0=performance.now();
  const res=await AI.ask(S.board,S.turn,S.level);
  if(g!==GEN)return;
  const minT=550+Math.random()*350,el=performance.now()-t0;
  if(el<minT)await wait(minT-el);
  if(g!==GEN)return;
  if(slotP){await slotP;if(g!==GEN)return;}
  let mv=res&&res.move;
  const fl0=mv>=0?E.flipsOf(S.board,mv,S.turn):[];
  if(!fl0.length){mv=pick(E.legal(S.board,S.turn));}
  updateMeter(res);
  await playMove(mv,S.turn,E.flipsOf(S.board,mv,S.turn),'cpu');
  if(g!==GEN)return;
  S.turn=-S.turn;nextTurn();
}
function updateMeter(res){
  if(!res||res.move<0)return;
  const WIN=E.WIN;
  let d=null;
  if(res.exact)d=-res.score;
  else if(Math.abs(res.score)>=WIN)d=-(res.score-Math.sign(res.score)*WIN);
  if(d!==null){
    setMeter(d>0?100:d<0?0:50,d===0?'読み切り: 引き分け':`読み切り: ${d>0?'YOU':'CPU'} +${Math.abs(d)}`);
    if(!S.exactSaid&&S.level>=4){S.exactSaid=true;say(d<0?'exactWin':'exactLose');}
    return;
  }
  const p=Math.max(3,Math.min(97,100/(1+Math.exp(res.score/75))));
  const tag=p>=70?'YOU 優勢':p>=56?'YOU やや有利':p>44?'互角':p>30?'CPU やや有利':'CPU 優勢';
  setMeter(p,`${tag} ${Math.round(Math.max(p,100-p))}%`);
}
async function humanPlay(sq){
  if(S.phase!=='play'||S.busy||S.turn!==S.human)return;
  SND.init();
  const fl=E.flipsOf(S.board,sq,S.turn);
  if(!fl.length){SND.err();restart(cells[sq].el,'nope');return;}
  S.history.push({board:Array.from(S.board),moveNo:S.moveNo,last:S.last,tension:S.tension,fever:S.fever,combo:S.combo,score:S.score,rush:S.rush,st:{...S.st}});
  clearPreview();
  S.busy=true;clearHints();controls();status('think');
  const g=GEN;
  await playMove(sq,S.turn,fl,'human');
  if(g!==GEN)return;
  S.turn=-S.turn;nextTurn();
}

function endGame(){
  const {you,cpu}=counts();
  clearHints();
  if(S.phase==='demo'){S.phase='over';later(2400,startDemo);return;}
  S.phase='over';S.busy=true;S.stable=null;controls();status('over');hud();
  if(S.fever>0){S.fever=0;BG.setFever(false);SND.setFever(false);gauge();}
  const r=you>cpu?'win':you<cpu?'lose':'draw';
  const rec=STORE.rec[S.level]||(STORE.rec[S.level]={w:0,l:0,d:0});
  if(r==='win'){rec.w++;STORE.streak=(STORE.streak||0)+1;}else if(r==='lose'){rec.l++;STORE.streak=0;}else rec.d++;
  // win bonus: 1,000 per disc of margin, +100,000 for a perfect game
  if(r==='win')S.score+=(you-cpu)*1000+(cpu===0?100000:0);
  S.newRecord=S.score>(STORE.best[S.level]||0);
  if(S.newRecord)STORE.best[S.level]=S.score;
  save();buildLevels();
  SND.bgmStop();
  later(700,()=>{
    if(r==='win'){
      SND.fanfare();later(900,SND.airhorn);VOICE.say(cpu===0?'perfect':'win');danmaku('win',30);

      FX.confetti(180);later(600,()=>FX.confetti(140));later(1200,()=>FX.confetti(140));
      FX.coins(innerWidth*.2,innerHeight*.8,40,1.4);FX.coins(innerWidth*.8,innerHeight*.8,40,1.4);
      for(let k=0;k<12;k++)later(200+k*330,()=>{FX.firework(innerWidth*(.1+Math.random()*.8),innerHeight*(.1+Math.random()*.45),Math.random()*360);SND.firework();});
      say('cpuLose');
    }else if(r==='lose'){
      SND.boom();SND.glass();later(500,SND.lose);VOICE.say('lose');danmaku('lose',20);FX.glitch(20);document.body.classList.add('lost');
      FX.crack(innerWidth/2,innerHeight*.45,Math.max(innerWidth,innerHeight)*.55);FX.shake(20);flash('#ff2f4f',.3);LED.set('danger',3000);

}
function undo(){
  if(S.phase!=='play'||S.busy||S.turn!==S.human||!S.history.length){SND.err();return;}
  GEN++;
  const h=S.history.pop();
  S.board=Int8Array.from(h.board);S.moveNo=h.moveNo;S.last=h.last;S.tension=h.tension;S.fever=h.fever;S.combo=h.combo;S.st=h.st;S.score=h.score||0;S.rush=h.rush||0;setRank(rankOf(S.score));S.undos++;
  S.hintBusy=false;
  BG.setFever(S.fever>0);SND.setFever(S.fever>0);LED.base();
  renderBoard();
  SND.rewind();cutin('待った!','pass','時を戻した',800);say('undo');
  nextTurn();
}
async function hint(){
  if(S.phase!=='play'||S.busy||S.turn!==S.human||S.hintBusy)return;
  S.hintBusy=true;const b=$('#bHint');b.textContent='考え中…';controls();
  const g=GEN,mv=S.moveNo;
  const res=await AI.ask(S.board,S.turn,99);
  b.textContent='ヒント';
  if(g!==GEN)return;
  S.hintBusy=false;controls();
  if(mv!==S.moveNo||S.turn!==S.human||S.busy||!res||res.move<0)return;
  for(const c of cells)c.el.classList.remove('best');
  cells[res.move].el.classList.add('best');S.st.hints++;
  const c=cellCenter(res.move);FX.stars(c.x,c.y,10,c.s*.6);SND.coin();
}

/* ---------- setup screen ---------- */
function buildLevels(){
  const g=$('#lvgrid');g.textContent='';
  for(let i=1;i<=5;i++){
    const lv=LV[i],rec=STORE.rec[i]||{w:0,l:0,d:0};
    const wrap=document.createElement('div');wrap.className='lvopt lv'+i;
    const inp=document.createElement('input');inp.type='radio';inp.name='lv';inp.className='sr';inp.id='lv'+i;inp.value=i;inp.checked=STORE.level===i;
    inp.addEventListener('change',()=>{STORE.level=i;save();SND.init();SND.tick();});
    const lab=document.createElement('label');lab.htmlFor='lv'+i;
    const parts=[['lvn',lv.name],['lvs','★'.repeat(lv.stars)+'☆'.repeat(5-lv.stars)],['lvd',lv.desc],['lvr',`${rec.w}勝${rec.l}敗`]];
    for(const [cl,tx] of parts){const s=document.createElement('span');s.className=cl;s.textContent=tx;lab.append(s);}
    wrap.append(inp,lab);g.append(wrap);
  }
}
function syncSetup(){
  for(const r of document.querySelectorAll('input[name=side]'))r.checked=r.value===STORE.side;
  for(const r of document.querySelectorAll('input[name=fx]'))r.checked=r.value===S.fx;
  for(const r of document.querySelectorAll('input[name=voice]'))r.checked=r.value===(STORE.voice||'girl');
}
function openSetup(fromGame){
  buildLevels();syncSetup();
  $('#setupClose').hidden=!fromGame;$('#result').hidden=true;$('#setup').hidden=false;
  setTimeout(()=>$('#goBtn').focus(),30);
}
function setFx(v){
  S.fx=STORE.fx=v;root.dataset.fx=v;save();
  $('#bFx').textContent=v==='max'?'演出 MAX':'演出 ひかえめ';syncSetup();
}
function setSnd(m){
  STORE.snd=m;save();SND.setMode(m);
  $('#bSound').textContent=['音 OFF','音 SEのみ','音 ON'][m];
  if(m===2&&S.phase==='play'){SND.init();SND.bgmStart();}
}

/* ---------- input ---------- */
boardEl.addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)humanPlay(+c.dataset.i);});
let pv=-1;
function clearPreview(){pv=-1;FX.preview(null);for(const c of cells)c.el.classList.remove('wf');}
function preview(i){
  if(pv===i)return;clearPreview();
  if(S.phase!=='play'||S.busy||S.turn!==S.human||!cells[i].el.classList.contains('legal'))return;
  pv=i;
  const r0=i>>3,c0=i&7,arcs=[];
  for(const f of E.flipsOf(S.board,i,S.turn)){
    cells[f].el.classList.add('wf');
    const dr=Math.sign((f>>3)-r0),dc=Math.sign((f&7)-c0),a=cellCenter(f-dr*8-dc),b=cellCenter(f);
    arcs.push([a.x,a.y,b.x,b.y]);
  }
  FX.preview(arcs);SND.tick();
}
boardEl.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest('.cell');if(c)preview(+c.dataset.i);});
boardEl.addEventListener('pointerleave',clearPreview);
boardEl.addEventListener('focusin',e=>{const c=e.target.closest('.cell');if(c&&c.matches(':focus-visible'))preview(+c.dataset.i);});
boardEl.addEventListener('focusout',clearPreview);
let trailT=0;
boardEl.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||S.phase!=='play'||S.fx!=='max')return;
  const t=performance.now();if(t-trailT<35)return;trailT=t;
  FX.sparks(e.clientX,e.clientY,1,45,.4);
});
boardEl.addEventListener('keydown',e=>{
  const c=e.target.closest('.cell');if(!c)return;
  const i=+c.dataset.i,r=i>>3,col=i&7;let n=-1;
  if(e.key==='ArrowLeft'&&col>0)n=i-1;else if(e.key==='ArrowRight'&&col<7)n=i+1;
  else if(e.key==='ArrowUp'&&r>0)n=i-8;else if(e.key==='ArrowDown'&&r<7)n=i+8;
  if(n>=0){e.preventDefault();cells[i].el.tabIndex=-1;cells[n].el.tabIndex=0;cells[n].el.focus();}
});
$('#bUndo').addEventListener('click',undo);
$('#bHint').addEventListener('click',()=>{SND.init();hint();});
let rsArm=0;
$('#bRestart').addEventListener('click',()=>{
  const b=$('#bRestart');
  if(S.phase!=='play'||performance.now()-rsArm<2500){b.textContent='リスタート';newGame();return;}
  rsArm=performance.now();b.textContent='本当に？';setTimeout(()=>{b.textContent='リスタート';},2500);
});
$('#bSetup').addEventListener('click',()=>{SND.init();openSetup(S.phase==='play');});
$('#bSound').addEventListener('click',()=>{SND.init();setSnd((STORE.snd+2)%3);});
$('#bFx').addEventListener('click',()=>setFx(S.fx==='max'?'lite':'max'));
$('#goBtn').addEventListener('click',()=>{
  const sd=document.querySelector('input[name=side]:checked');if(sd)STORE.side=sd.value;
  const fx=document.querySelector('input[name=fx]:checked');if(fx)setFx(fx.value);
  save();newGame();
});
for(const r of document.querySelectorAll('input[name=side]'))r.addEventListener('change',()=>{STORE.side=r.value;save();});
for(const r of document.querySelectorAll('input[name=fx]'))r.addEventListener('change',()=>setFx(r.value));
// 声を選び直すと、その声で「スタート！！」を試聴
for(const r of document.querySelectorAll('input[name=voice]'))r.addEventListener('change',()=>{STORE.voice=r.value;save();if(r.value==='off')return;SND.init();VOICE.load(r.value,()=>VOICE.say('start'));});
$('#setupClose').addEventListener('click',()=>{$('#setup').hidden=true;});
$('#rAgain').addEventListener('click',newGame);
$('#rSetup').addEventListener('click',()=>{openSetup(false);startDemo();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#setup').hidden&&!$('#setupClose').hidden)$('#setup').hidden=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)SND.bgmStop();else if(S.phase==='play')SND.bgmStart();});
document.addEventListener('pointerdown',()=>{SND.init();if(S.phase==='play')SND.bgmStart();},{once:true});

/* ---------- boot (keeps a game in progress across live updates) ---------- */
function snap(){return{game:S.phase==='play'?S.stable:null};}
function boot(data){
  setFx(S.fx);setSnd(STORE.snd);buildLevels();syncSetup();VOICE.load();
  BG.start();FX.start();
  const g=data&&data.game;
  if(g&&Array.isArray(g.board)&&g.board.length===64){
    GEN++;$('#setup').hidden=true;
    Object.assign(S,{phase:'play',board:Int8Array.from(g.board),turn:g.turn,human:g.human,level:g.level,moveNo:g.moveNo,last:g.last,
      tension:g.tension,fever:g.fever,combo:g.combo,undos:g.undos,score:g.score||0,rush:g.rush||0,history:g.history||[],st:g.st||{maxFlip:0,corners:0,hints:0},busy:true,exactSaid:false,hintBusy:false});
    BG.setFever(S.fever>0);SND.setFever(S.fever>0);setRank(rankOf(S.score));
    renderBoard();hud();gauge();controls();setMeter(50,'互角');
    nextTurn();
  }else{
    openSetup(false);startDemo();
  }
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(snap);
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});
})();
</script>
